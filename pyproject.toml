[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-learning"
version = "0.2.0"
description = "A personal LLM command-line assistant"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "openai>=3.3,<4",
    "httpx>=0.28,<1",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
    "jsonschema>=4.26,<5",
    "rich>=14,<15",
]

[project.scripts]
agent100 = "ai_agent_learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
